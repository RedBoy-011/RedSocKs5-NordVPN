services:
  vpn-de:
    image: qmcgaw/gluetun:v3.40.0
    container_name: nord-socks-de
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${NORDVPN_USERNAME}
      - OPENVPN_PASSWORD=${NORDVPN_PASSWORD}
      - SERVER_COUNTRIES=${LOC_DE:-Germany}
      - TZ=${TZ:-Europe/Istanbul}
    ports: ["${PORT_DE:-1081}:1080"]
    restart: unless-stopped

  socks-de:
    image: serjs/go-socks5-proxy:latest
    network_mode: service:vpn-de
    environment:
      - REQUIRE_AUTH=false
    depends_on: {vpn-de: {condition: service_healthy}}
    restart: unless-stopped

